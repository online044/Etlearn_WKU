<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        // 0. Early Theme Class Application (Defaults to Night Mode)
        try {
          var savedTheme = localStorage.getItem('ethiolearn_theme');
          if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (_) {
          document.documentElement.classList.add('dark');
        }

        // 1. WebSocket shim for vite-hmr to prevent connection errors behind reverse proxy
        try {
          var RealWebSocket = window.WebSocket;
          if (RealWebSocket) {
            window.WebSocket = function(url, protocols) {
              var isViteHmr = 
                (typeof protocols === 'string' && protocols.indexOf('vite-hmr') !== -1) ||
                (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
                (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite-hmr') !== -1));
              
              if (isViteHmr) {
                var listeners = {};
                return {
                  url: String(url),
                  readyState: 1, // OPEN
                  CONNECTING: 0,
                  OPEN: 1,
                  CLOSING: 2,
                  CLOSED: 3,
                  send: function() {},
                  close: function() {
                    this.readyState = 3;
                    if (listeners['close']) {
                      listeners['close'].forEach(function(fn) {
                        try { fn({ type: 'close', wasClean: true, code: 1000, reason: '' }); } catch (_) {}
                      });
                    }
                  },
                  addEventListener: function(event, handler, options) {
                    if (!listeners[event]) listeners[event] = [];
                    listeners[event].push(handler);
                    if (event === 'open') {
                      setTimeout(function() {
                        try {
                          if (typeof handler === 'function') handler({ type: 'open' });
                          else if (handler && typeof handler.handleEvent === 'function') handler.handleEvent({ type: 'open' });
                          if (options && options.once) {
                            var idx = listeners[event].indexOf(handler);
                            if (idx !== -1) listeners[event].splice(idx, 1);
                          }
                        } catch (_) {}
                      }, 0);
                    }
                  },
                  removeEventListener: function(event, handler) {
                    if (!listeners[event]) return;
                    var idx = listeners[event].indexOf(handler);
                    if (idx !== -1) listeners[event].splice(idx, 1);
                  },
                  dispatchEvent: function() { return true; }
                };
              }
              return new RealWebSocket(url, protocols);
            };
            window.WebSocket.prototype = RealWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
        } catch (_) {}

        // 2. Comprehensive error filtering for [vite] and benign background noise
        var isBenign = function(msg) {
          if (!msg) return false;
          var s = '';
          if (typeof msg === 'string') s = msg;
          else if (msg.message && typeof msg.message === 'string') s = msg.message;
          else if (msg.reason && typeof msg.reason === 'string') s = msg.reason;
          else {
            try { s = String(msg); } catch (_) { s = ''; }
          }
          return s.indexOf('[vite]') !== -1 || 
                 s.indexOf('@firebase') !== -1 || 
                 s.indexOf('firestore') !== -1 || 
                 s.indexOf('Firestore') !== -1 || 
                 s.indexOf('Cloud Firestore backend') !== -1 || 
                 s.indexOf('Failed to fetch') !== -1 || 
                 s.indexOf('ServiceWorker') !== -1 || 
                 s.indexOf('serviceWorker') !== -1 || 
                 s.indexOf('sw.js') !== -1 || 
                 s.indexOf('fetching the script') !== -1 || 
                 s.indexOf('websocket') !== -1;
        };

        var wrapConsole = function(method) {
          var orig = console[method];
          if (!orig) return;
          console[method] = function() {
            var args = Array.prototype.slice.call(arguments);
            for (var i = 0; i < args.length; i++) {
              if (isBenign(args[i])) return;
            }
            orig.apply(console, args);
          };
        };

        ['error', 'warn', 'info', 'debug', 'log'].forEach(wrapConsole);

        window.addEventListener('error', function(event) {
          if (event && (isBenign(event.message) || isBenign(event.error))) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (event && (isBenign(event.reason) || (event.reason && isBenign(event.reason.message)))) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1128" />
    <meta name="description" content="Bilingual (Amharic/English) AI-powered study platform for Ethiopian university students with past exams, AI flashcards, and university notes." />
    <meta name="application-name" content="EthioLearn" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EthioLearn" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta property="og:title" content="EthioLearn" />
    <meta property="og:description" content="Bilingual (Amharic/English) AI-powered study platform for Ethiopian university students with past exams, AI flashcards, and university notes." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512x512.png" />
    <title>EthioLearn</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script>
      // Clean iframe SW guard to avoid cross-origin sandbox errors; top-level window registers via virtual:pwa-register
      if ('serviceWorker' in navigator) {
        var isIframe = false;
        try {
          isIframe = window.self !== window.top;
        } catch (_) {
          isIframe = true;
        }

        if (isIframe) {
          try {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                registrations[i].unregister();
              }
            }).catch(function() {});
          } catch (_) {}
        }
      }
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-[#070D1E] text-slate-800 dark:text-[#F0EDE8] transition-colors duration-200">
    <div id="root">
      <div style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: #0a1128; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-user-select: none; user-select: none;">
        <div style="display: flex; flex-direction: column; align-items: center; text-align: center; padding: 20px;">
          <img src="/ethiolearn_icon.jpg" alt="EthioLearn Pro" style="width: 100px; height: 100px; border-radius: 22px; box-shadow: 0 12px 30px rgba(0,0,0,0.4); margin-bottom: 24px; animation: logo-pulse 2s infinite ease-in-out; border: 2px solid rgba(255,255,255,0.08);" />
          <h1 style="color: #ffffff; font-size: 24px; font-weight: 900; margin: 0; letter-spacing: 3px;">ETHIOLEARN</h1>
          <p style="color: #00a2e8; font-size: 11px; font-weight: 800; margin: 8px 0 0 0; text-transform: uppercase; letter-spacing: 5px; opacity: 0.9;">LEARN &bull; GROW &bull; ACHIEVE</p>
          
          <div style="margin-top: 40px; width: 60px; height: 4px; background-color: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; position: relative;">
            <div style="width: 30px; height: 100%; background: linear-gradient(90deg, #00a2e8, #00a896); border-radius: 2px; position: absolute; top: 0; left: 0; animation: loading-bar-swipe 1.5s infinite ease-in-out;"></div>
          </div>
        </div>
      </div>
      <style>
        @keyframes logo-pulse {
          0%, 100% { transform: scale(1); opacity: 0.95; }
          50% { transform: scale(1.04); opacity: 1; }
        }
        @keyframes loading-bar-swipe {
          0% { left: -50%; }
          100% { left: 100%; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
