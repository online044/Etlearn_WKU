<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0A1128" />
      <stop offset="100%" stopColor="#1E293B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FDE047" />
      <stop offset="50%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#D97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#34D399" />
      <stop offset="100%" stopColor="#059669" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield/Rounded Canvas -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#F59E0B" stroke-width="2.5" stroke-opacity="0.4" />

  <!-- Subtle Inner Border -->
  <rect x="10" y="10" width="108" height="108" rx="22" fill="none" stroke="#FDE047" stroke-width="1" stroke-opacity="0.15" />

  <!-- Academic Graduation Cap (Top) -->
  <g transform="translate(0, -2)">
    <!-- Cap Diamond -->
    <polygon points="64,22 102,38 64,54 26,38" fill="url(#goldGrad)" filter="url(#goldGlow)" />
    <polygon points="64,26 96,38 64,50 32,38" fill="#0A1128" opacity="0.25" />

    <!-- Cap Skull Base -->
    <path d="M 44,46 L 44,55 C 44,64 84,64 84,55 L 84,46 Z" fill="#D97706" />

    <!-- Tassel -->
    <path d="M 64,38 L 36,44 L 34,58" stroke="#FDE047" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <circle cx="34" cy="59" r="2.8" fill="#FDE047" />
  </g>

  <!-- Open Book of Knowledge (Center-Bottom) -->
  <g transform="translate(0, 4)">
    <!-- Ethiopian Tri-color Page Layers -->
    <!-- Green base leaf -->
    <path d="M 64,96 C 50,88 32,86 18,92 C 18,72 34,68 64,74 Z" fill="url(#emeraldGrad)" opacity="0.85" />
    <path d="M 64,96 C 78,88 96,86 110,92 C 110,72 94,68 64,74 Z" fill="url(#emeraldGrad)" opacity="0.85" />

    <!-- Main Gold Open Book Pages -->
    <path d="M 64,92 C 50,84 34,82 22,87 C 22,69 36,65 64,71 Z" fill="url(#goldGrad)" />
    <path d="M 64,92 C 78,84 94,82 106,87 C 106,69 92,65 64,71 Z" fill="url(#goldGrad)" />

    <!-- Book Spine -->
    <line x1="64" y1="71" x2="64" y2="98" stroke="#78350F" stroke-width="2.5" stroke-linecap="round" />

    <!-- Radiant Ethiopian Ge'ez Star of Wisdom in Center -->
    <polygon points="64,61 66,66 71,67 67,71 68,76 64,73 60,76 61,71 57,67 62,66" fill="#FFFBEB" stroke="#D97706" stroke-width="0.8" />
  </g>
</svg>
