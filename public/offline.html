<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | EthioLearn</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0a1128;
      color: #f0ede8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Ethiopic", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .icon-container {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-container svg {
      width: 40px;
      height: 40px;
      stroke: #f59e0b;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }
    .amharic-title {
      font-size: 16px;
      color: #f59e0b;
      margin-bottom: 16px;
      font-weight: 600;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 12px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: #f59e0b;
      color: #0a1128;
      font-weight: 700;
      font-size: 14px;
      padding: 14px 20px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      margin-top: 16px;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .badge {
      display: inline-block;
      margin-top: 18px;
      padding: 4px 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 9999px;
      font-size: 11px;
      color: #64748b;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-container">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-2.828-6.364m0 0l2.828 2.828M3 3l18 18" />
      </svg>
    </div>
    <h1>You Are Currently Offline</h1>
    <div class="amharic-title">የኢንተርኔት ግንኙነት ተቋርጧል</div>
    <p>EthioLearn requires an active internet connection to synchronize your quizzes, AI answers, and university notes.</p>
    <p style="font-size: 13px; color: #cbd5e1;">የተቀመጡ ገጾችን ለመጠቀም ወደ ኋላ መመለስ ወይም ግንኙነት ሲመለስ እንደገና መሞከር ይችላሉ።</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection / እንደገና ሞክር</button>
    <br>
    <span class="badge">EthioLearn PWA &bull; Offline Shield</span>
  </div>
</body>
</html>
